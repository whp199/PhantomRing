; PhantomRingHost.ini -- Elden Ring side of PhantomRing (lives next to PhantomRingHost.dll).
; Every key is optional; the value shown is the default. Booleans: true/false/1/0/yes/no/on/off.
; Values marked UNVERIFIED are conventions the first live test confirms; pin them here once known.

[Link]
; Shared memory both games map. Empty = the platform default: under Wine/Proton the file
; file:Z:\dev\shm\phantomring_v1 (each game has its own prefix; a /dev/shm file reaches both), on Windows the
; named mapping name:Local\PhantomRing_v1. The guest's [Link] Mapping must name the same one.
mapping =

[Launch]
; Windows (docs/WINDOWS.md): Elden Ring starts MGSV by itself, hidden, with the PhantomRing guest, unless an
; MGSV guest is already running. auto = on Windows, off under Wine/Proton (`pr launch` starts MGSV there).
StartMgsv = auto
; Full path of mgsvtpp.exe; empty = found through Steam (registry -> libraryfolders.vdf -> appmanifest_287700.acf).
MgsvExe =
; Extra command-line arguments for mgsvtpp.exe.
MgsvArgs =
; Copy the guest (dinput8.dll + PhantomRingGuest.ini from the mgsv folder next to this DLL) into MGSV's folder
; first. A dinput8.dll PhantomRing didn't put there (another mod) is never overwritten: MGSV is not started then.
; An edited PhantomRingGuest.ini there is kept.
InstallGuest = true
; How long (ms) to wait for an MGSV guest that is already running (e.g. from the last Elden Ring) before starting one.
WaitGuestMs = 3000

[Debug]
; Debug-level log lines (address table details, UI state changes, console traffic, hurt events).
debug = false
; Also hash eldenring.exe (87 MB) at start; the TimeDateStamp + SizeOfImage check always runs.
verify_sha256 = false

[Features]
; XInput bridge: the controller goes to MGSV, Elden Ring gets Start/View only while Snake plays.
input = true
; The Tarnished becomes an invisible puppet moved by Snake.
puppet = true
; Elden Ring's camera follows MGSV's camera.
camera = true
; Dev console (tools: `pr er '<command>'`, `help` lists commands).
console = true
; Nearby Elden Ring characters published to MGSV (ActorTable).
actors = true
; Debug lines (skeleton, facing, buddy, shot traces) through Elden Ring's CSEzDraw.
debug_draw = true
; Battle buddy (D-Walker first): placement, ground snap, riding, buddy shots.
buddy = true

[Input]
; XInput pad index published to MGSV; -1 = the first pad that answers.
user_index = -1
; Buttons Elden Ring still gets while Snake plays (XINPUT bits): 0x0010 Start (ER menu) | 0x0020 Back/View (map).
allow_buttons = 0x0030
; Learn which CSMenuMan UI states are ER menus (entries that turn visible after Start/View).
menu_learn = true
; Pin learned menu UI state indices here (comma separated, e.g. 0x12,0x13); the log prints them.
menu_ui_states =
; After Start/View, treat an ER menu as open for this long (ms) so the first menu is usable.
; (A blocking menu is also detected directly through CSMenuMan+0x798, re-backlog E4.)
menu_latch_ms = 1500
; While Elden Ring shows an interaction prompt (grace, door, item, NPC), this button goes to Elden Ring
; on a fresh press and MGSV does not see it (re-backlog E6). 0x8000 = Y, Elden Ring's "event action" on an Xbox pad
; (VERIFIED live: Y rests at a grace, A does nothing; MGSV's own Y = mount/pick up, so Y near both goes to Elden Ring);
; 0x1000 = A; 0 = off.
prompt_button = 0x8000
; Prompts where Elden Ring walks the Tarnished itself (ActionButtonParam ids; 10000 = "Traverse the mist", VERIFIED live:
; it refused to while the puppet held him): the puppet steps aside for release_ms (the Tarnished shows meanwhile), then
; Snake takes over where Elden Ring left him.
release_prompts = 10000
release_ms = 4500
; "Rest at site of grace" (ActionButtonParam ids; 6101 seen in the player's session: Elden Ring's HUD hid ~3 s after it,
; its grace menu): Elden Ring's HUD hiding within a few seconds of this prompt is a rest -- Elden Ring refills the flasks,
; and the guest refills Snake's ammo (kHEvRested 0). "none" = never.
rest_prompts = 6101
; After such a press Elden Ring has the whole controller (MGSV a neutral pad, Snake holds still) for at least
; interaction_min_ms (a pickup), and after that for as long as Elden Ring's in-game HUD stays hidden -- CSMenuMan UI
; state interaction_hud_state, hidden while you rest at a grace (VERIFIED live: state 7, 2.3-2.9 s after the press),
; talk or read (used only when that HUD was visible at the press, so ER's "auto" HUD can't hold the controller);
; -1 = minimum time only. interaction_max_ms caps it (0 = no cap).
; Until that HUD has hidden, Elden Ring gets only A/B/X/Y, the D-pad, Start and View (no stick, bumpers or triggers:
; they would move the hidden Tarnished after a pickup while Snake holds still).
interaction_hud_state = 7
interaction_min_ms = 3500
interaction_max_ms = 0
; While Snake plays, View held this long (ms) opens MGSV's iDroid (Elden Ring never sees that View); a shorter tap
; still opens Elden Ring's map, passed on when it is released. 0 = View is always Elden Ring's.
view_hold_ms = 400
; MGSV opens its iDroid on Start held ~1 s (its Back/View is the pause menu): the View hold above is sent to MGSV as
; Start held this long (ms). The View itself never reaches MGSV, even after its menu takes the pad.
guest_idroid_start_ms = 1200
; While MGSV's own menu is open (GuestState kGuestInMenu: iDroid, pause), MGSV gets the whole pad (Start, View and Y
; too) and Elden Ring gets nothing, so the iDroid can be worked and closed without opening Elden Ring's menus.
guest_menu_owns_pad = true
; Elden Ring's button glyphs while Snake plays: its own pad sees only Start/View then, so a mouse nudge left keyboard
; glyphs on every prompt ("E: Touch grace"). 0 = pad (Xbox glyphs), 1 = keyboard, -1 = leave it to Elden Ring.
pad_glyph_device = 0
; Tarnished mode (docs/HOST.md): View + Start held together chord_ms (ms) hands the controller to the Tarnished (flasks,
; spirit ashes, Torrent, jumps, ladders), and again to give it back to Snake; 0 = off. Neither press reaches Elden Ring's
; menu or map, nor MGSV's iDroid. To leave room for it, Start (and View in Tarnished mode) reaches Elden Ring
; start_wait_ms after it went down, or at once when it is released sooner (a tap): Start first, View within that time
; is the chord. View first: Start within chord_window_ms (ms) after View is the chord even when View's hold already went
; to MGSV as its iDroid (the hold is cut before MGSV opens it; if MGSV opens it anyway, it gets a Start that closes it).
chord_ms = 1000
start_wait_ms = 400
chord_window_ms = 700
; Keyboard keys that open Elden Ring menus (Windows virtual-key codes: 0x1B Esc = its menu, 0x47 G = its map): pressed in
; Elden Ring's window they count like the pad's Start, so the menu is noticed (MGSV's HUD and the throw markers hidden,
; the pad to Elden Ring). "none" = only the pad.
menu_keys = 0x1B, 0x47
; Ladders (docs/HOST.md "Ladders"): Snake can't climb, so a ladder is an automatic Tarnished mode. Snake's Y on Elden Ring's
; "Climb" / "Descend" prompt (ActionButtonParam ids; "none" = off) makes the puppet step aside: the Tarnished shows, Elden
; Ring has the whole pad (the left stick climbs) and its own camera, for as long as its ladder state says he is on one
; (CSPlayerLadderModule). Snake takes over where he got off; the stick that climbed moves him only once it was let go.
; The press itself reaches Elden Ring ladder_press_delay_ms after it, with the Tarnished in its hands (pressed while the
; puppet held him, Elden Ring never started a descent). ladder_wait_ms: how long a press waits for the climb to start (else
; Snake plays on); ladder_settle_ms: how long the Tarnished must be off the ladder before Snake takes over.
ladder_prompts = 5000, 5010
ladder_press_delay_ms = 100
ladder_wait_ms = 1500
ladder_settle_ms = 300

[Keyboard]
; Keyboard and mouse play Snake (roadmap 2.14 tier 1, docs/HOST.md "Keyboard and mouse"; UNVERIFIED live). While Snake plays,
; the keys and the mouse become the pad MGSV gets, so everything the pad does (View tap = Elden Ring's map, View held = the
; iDroid, the chord, Y on Elden Ring's prompts) works the same; Elden Ring then gets none of the keyboard but er_keys (Esc =
; its menu) and none of the mouse. Its menus, Tarnished mode and the time before Snake takes over are left alone (only the
; chord key is kept from it in Tarnished mode: held = the chord, a tap reaches it at the release). A controller keeps
; priority: Snake's pad comes from the device used last, the controller on a tie. Off by default (controller players,
; Steam Deck: nothing changes). `tools/pr er "input kbm on"` tries it without editing this file.
enabled = false
; Bindings: key names (W, Shift, Ctrl, Alt, Space, Tab, Esc, Enter, F1..F12, Up/Down/Left/Right, LMB, RMB, MMB, Mouse4,
; Mouse5, WheelUp, WheelDown) or Windows virtual-key codes (0x41); several keys separated by commas; none = unbound.
; Left stick: WASD walk (walk_tilt of a full push), with run held full tilt (run_by_default = true swaps them).
move_up = W
move_down = S
move_left = A
move_right = D
run = Shift
walk_tilt = 0.5
run_by_default = false
; A (tap: crouch / stand, hold: prone), B, X, Y (MGSV's action, or Elden Ring's while it shows a prompt), LB (hold: call
; menu), RB (first person while aiming), LT (aim), RT (fire)
crouch = Ctrl
reload = R
dive = Space
action = E, F
call_menu = Q
first_person = V
aim = RMB
fire = LMB
; D-pad: up = primary weapons, down = handgun, right = support items, left = items (hold one and move the mouse to pick).
; A wheel notch is one tap of wheel_tap_ms (ms).
primary = 1, WheelUp
handgun = 2, WheelDown
support = 3
items = 4
wheel_tap_ms = 100
; View (tap = Elden Ring's map, held = MGSV's iDroid); Start only while MGSV's own menu is open (closes it: Esc is Elden
; Ring's menu otherwise); the stick clicks (right = D-Walker's orders); the Tarnished-mode chord (Start + View held
; together: hold it [Input] chord_ms).
view = Tab
menu = Esc
left_stick_click = C
right_stick_click = MMB
chord = G
; Keys Elden Ring still gets while Snake plays (its own menu).
er_keys = Esc
; ...and also while an Elden Ring interaction (a pickup, a lever, a dialog) has the controls before its HUD hides: what a
; prompt or a dialog needs. The rest of the keyboard and the mouse stay hidden then, so WASD, Space, F or a click can't
; walk, roll, jump or swing the hidden Tarnished (UNVERIFIED live which keys its dialogs want).
er_interaction_keys = E, Q, Enter, Up, Down, Left, Right
; The mouse is the right stick: its speed (counts/s, smoothed over mouse_smoothing_ms) through a curve. Deflection =
; anti_deadzone + (1 - anti_deadzone) x min(1, u x (1 + acceleration x u)), u = speed x sensitivity / 1000; below
; mouse_min_speed it is centred. Try values live: `tools/pr er "input kbm sens 0.8"` (accel, antidz, smooth, minspeed).
mouse_sensitivity = 0.6
mouse_acceleration = 0.5
mouse_anti_deadzone = 0.2
mouse_min_speed = 15
mouse_smoothing_ms = 25
mouse_invert_y = false
; Keep the cursor inside Elden Ring's window while the keyboard plays Snake (let go in its menus and Tarnished mode).
capture_cursor = true
; Elden Ring's keyboard glyphs ("E: Rest at site of grace") while the keyboard plays Snake, [Input] pad_glyph_device otherwise.
keyboard_glyphs = true
; With no controller connected Elden Ring polls none, so nothing reaches MGSV: auto = turn on the bridge's virtual pad (as
; `input virtualpad on`) the first time the keyboard is used while Elden Ring polls no controller; on = at once; off = never.
virtual_pad = auto
; Tarnished mode: a tap of the chord key (let go before chord_ms) opens Elden Ring's map: view = as the pad's View (works
; whatever key Elden Ring's own map is on; live 2026-10-15 a save had it on M, not G), key = the chord key itself reaches
; Elden Ring (only useful where its map is on that key), off = nothing.
chord_tap = view

[Puppet]
; How the Tarnished is hidden: render_flag (ChrIns+0x1C5 bit3, UNVERIFIED), fade (+0x250 transparency), none.
hide_mode = render_flag
; How Snake's motion moves the puppet:
;   root_motion = Snake's displacement fed in as the Tarnished's animation root motion (PlayerCtrl vfunc 12, instance vtable
;                 copy): Elden Ring's own Havok proxy moves him -- walls, slopes, steps, gravity, and the crates, pots and
;                 barrels he runs into break as they do for the Tarnished (re-backlog E1, VERIFIED live 2026-10-12; falls back
;                 to kinematic if the hook stays silent for 1 s)
;   kinematic   = host-side ray-cast controller + ChrIns::SetPosition every frame (works without any hook)
; root_motion is OFF by default: in the first real play session (2026-10-12 evening) Snake ran into invisible walls
; everywhere with it (the automated tests had passed); kinematic plays well. Live: pr er "puppet motion <mode>".
motion = kinematic
; root_motion: Elden Ring's proxy moves 60-95% of what it is handed (less uphill, VERIFIED live). The shortfall is handed
; again, up to this many metres behind Snake (dropped when a wall blocks the proxy); 0 = off.
catch_up = 0.6
; kinematic: a puppet boxed in (7 or 8 of 8 directions blocked within its radius + 0.3 m, e.g. inside a cart's bed) for
; unstick_seconds goes back to where it last stood free (session 4: Snake got stuck inside a wooden cart).
unstick = true
unstick_seconds = 0.5
; ... and Snake asking to move and refused (a wall, a ceiling) in every direction he tries (three or more of eight) for
; stall_seconds of trying goes back to where he last stood free too, or, with no such place, the corner suggests Tarnished
; mode (2026-10-14: stuck under the Roundtable Hold's basement stairs, 59 wall contacts and never boxed in).
stall_seconds = 2.5
; Kinematic: never into a space lower than Snake's height in his stance (MGSV's: height_stand / height_crouch / height_prone,
; m): a ray up where a move would end; the wall rays above that height are left out (crouched, he goes under a 1.3 m
; beam). Under a low ceiling already (he stood up there), moves that don't make it lower still go. height_ride: riding
; D-Walker or D-Horse (0 = no ceiling check).
ceiling = true
height_stand = 1.8
height_crouch = 1.2
height_prone = 0.5
height_ride = 0
; A fall that never lands: with NoDead set, a chasm whose death is Elden Ring's kill volume (not a landing) can't kill the
; puppet, and kinematic gravity would let Snake fall for ever. Falling for fall_watch_seconds (s), or deeper than
; fall_watch_drop (m), counts as his death (YOU DIED, the grace). A fall this long is lethal on landing anyway (19.8 m/s
; after 2 s). 0 = that check off.
fall_watch_seconds = 4
fall_watch_drop = 60
; Catch Elden Ring hits in CSPlayerDamageModule::ReceiveDamage and cancel them (no HP loss, no stagger),
; forwarding amount and direction to MGSV (re-backlog E2, statically verified, UNVERIFIED live: set false
; if the first enemy hit misbehaves). HP-loss detection stays on for poison/fall damage either way.
hit_hook = true
; Keep the puppet alive while MGSV owns health (data+0x19B bit0).
nodead = true
; NoDamage (bit1) would hide hits from us: hits are detected by HP loss, so it stays off.
nodamage = false
; The ER HP bar shows Snake's life fraction: HP = max(1, round(max HP x life / lifeMax)), set every frame. Elden
; Ring's own hits are measured at full HP and the mirrored value put back (er/HitHook.h).
mirror_life = true
; Elden Ring heals on the puppet (Crimson Tears, resting at a grace, a regenerating talisman) raise Snake's life by
; the same share (kHEvHeal); false = the mirror simply puts the HP back.
forward_heals = true
; When Snake dies, kill the Tarnished so Elden Ring runs YOU DIED and the grace respawn.
kill_on_guest_death = true
; Speed limits (m/s) for one frame's odometer step: on foot / riding D-Walker (dash and hover) / riding D-Horse (gallop).
max_speed = 12
max_speed_vehicle = 32
max_speed_horse = 32
; An odometer jump larger than this (m) in one frame is a guest-side warp: ignored.
teleport_drop = 4
; Elden Ring moved the player further than this (m) by itself (grace, elevator): follow it.
resync_distance = 1.5
; Kinematic controller (m, m/s^2).
radius = 0.35
step_up = 0.5
step_up_vehicle = 0.8
step_up_horse = 0.8
; The kinematic body's radius while riding: D-Walker (or another vehicle), D-Horse (longer than Snake: head and tail).
radius_vehicle = 0.35
radius_horse = 0.45
snap_down = 0.6
chest_height = 1.3
gravity = 9.81
; cs_phys_world_cast_ray filter: a query "filter info", bits 0-6 = its collision layer, bits 25-29 = a sub-id that skips the
; ignored character's own bodies with the same one (docs/HOST.md "Collision filters"). 0x2000058 (layer 0x58) is what the
; game's only caller uses: an aim/sight ray. It also hits enemies' hit capsules and leaves out the floors, ramps and walls
; that only characters collide with. Sight, bullets, the camera, mines, buddies use it.
ray_filter = 0x2000058
; Snake's body (kinematic motion) against the world: ground_filter for the rays up and down (ground snap, landing, step,
; head room, the start), wall_filter for the rays sideways (walls). 0 = ray_filter. 0x2000016 (layer 0x16) is what a
; character's own capsule (layer 3) collides with, the characters left out: everything the Tarnished stands on. Statically
; RE'd and checked against this exe at start (address table "collision layer 0x16"; else ray_filter is used and logged),
; UNVERIFIED live. The old way: ground_filter = 0x2000058. Live test: pr er "call ray x y z 0 -3 0 0x2000016".
ground_filter = 0x2000016
; Walls: wall_filter (0 = ray_filter: it stops Snake at enemies' hit capsules) and wall_filter_also too, the nearer hit
; kept (0 = none). 0x2000016 there adds the characters' own walls: a scaffold whose floor only ground_filter sees has its
; railings and boarding in those layers, and wall_filter alone let Snake walk through them off the edge. UNVERIFIED live:
; if Snake stops at an invisible wall the Tarnished walks through, set wall_filter_also = 0 (and report where).
wall_filter = 0
wall_filter_also = 0x2000016
; Snake's own ray query for the ground_filter and wall_filter_also rays: material classes the game's ray collector drops
; (material id / 100 = 2 or 5) that they keep (bit c = class c, e.g. 0x24), and the Havok broad-phase layers they look in
; (cast_ray: 0xFB; 0xFF = all). 0 / 0xFB = the game's cast_ray (default: live at Stormveil's cliffside scaffold neither
; mattered). Diagnostics: pr er "call rayall x y z 0 -3 0 0x2000016 0xff" lists every hit with its material and layer.
ground_keep = 0
ground_layers = 0xFB
; The ground under the whole body: its centre and four points at 0.8 x radius -- the centre's ground, or where a gap is under
; it (planks, seams between boards) the ground the side probes agree on; one probe on a rim holds nothing. Standing, walking,
; falling, the start and the landing of a jump or a hop all use it. false = one ray under the centre (the old way: Snake fell
; through Stormveil's wooden scaffolding, live 2026-10-14).
ground_probes = true
; Dive = hop (roadmap 2.9; on since the live pass of 2026-10-14: three dives running/up a slope hopped 0.6 m, ~2.4 m, landed
; with no damage, none in a jump): besides the jump (R3: jump* below), MGSV's dive (X, running) lifts the
; kinematic puppet in a small parabola, hop_height (m) high and hop_length (m) long on level ground: over a gap up to ~2 m
; and onto a ledge up to hop_height + hop_step (~0.75 m) high. A 1 m wall is never climbed (in the air a ledge is a wall
; until the feet are within hop_step of its top), and his head never goes into a ceiling: under one the hop is lower, and
; with less than hop_min_rise (m) of room above his head there is none. The landing is a fall's, on the whole body's ground
; (fall damage only below the take-off's height, as a jump's). The dive must move him within hop_wait_ms of MGSV saying so
; (no move, no hop). Kinematic motion only. Live: pr er "puppet hop on|off".
hop = true
hop_height = 0.6
hop_length = 2.5
hop_step = 0.15
hop_min_rise = 0.15
hop_wait_ms = 300
; Snake jumps (MGSV has no jump: the guest's [Jump] button, R3 by default, sets GuestState kGuestJumping; kinematic motion
; only). The puppet jumps through Elden Ring's collision as the Tarnished would: jump_apex (m) high (less under a ceiling;
; none with less than jump_min_room m over his head), standing only, the run's speed carried on in the air and steered by
; Snake's own motion at jump_air_control m/s^2 at most; a ledge's top up to jump_air_step (m) above his feet in the air is
; landed on. A jump's landing counts as a fall only from the height it left from (fall damage from real heights only).
; jump_camera_hold: the camera's height over Snake stays as it was while he is in the air. UNVERIFIED live.
jump = true
jump_apex = 1.2
jump_min_room = 0.15
jump_air_control = 3
jump_air_step = 0.3
jump_camera_hold = true

[Axes]
; How MGSV world maps into Elden Ring (all UNVERIFIED until the debug skeleton is seen live):
; mirror_x -1 if Fox and Havok differ in handedness (the skeleton's left/right swap, turns go the wrong way).
mirror_x = -1
; -1 if GuestState.rootYaw turns the other way than atan2(forward.x, forward.z).
mgsv_yaw_sign = 1
; Elden Ring character local forward: auto (voted from the Tarnished's own running; -1 until then: every live session
; voted -Z), 1 (+Z) or -1 (-Z).
er_forward = auto
; MGSV camera view direction: 1 = R*(0,0,+1) (Fox forward is +Z for characters), -1 = R*(0,0,-1).
mgsv_cam_forward = 1
; Height of GuestState.rootPos above Snake's feet (m) if MGSV's root is not at the feet.
mgsv_root_offset_y = 0

[Camera]
; ER task group that writes CSCamera.pers_cam_1: 107 DrawParamUpdate (default), 106 CameraStep, 144 Draw_Pre.
task_group = 107
; Sign of the pers_cam_1 +0x30 row vs the view direction: auto (voted from ER's own camera), 1 or -1.
forward_row = auto
; ER fov = MGSV vertical fov (rad) * fov_scale + fov_offset.
fov_scale = 1.0
fov_offset = 0.0
; Copy MGSV's near plane.
write_near = true
; Pull the camera in front of Elden Ring walls (ray from the puppet's eye).
collision = true
eye_height = 1.6
eye_height_vehicle = 2.2
eye_height_horse = 2.4
collision_margin = 0.25
; The pull-in comes at once (a wall never shows through) and goes back out eased over collision_ease_out seconds (live it
; jumped up to 5 m in one frame as tree trunks crossed the line). collision_radius: four more rays this far around the
; camera (m; 0 = the centre ray only).
collision_radius = 0.15
collision_ease_out = 0.2
; The camera follows the puppet's feet height with this time constant (s): the kinematic puppet snaps onto Elden Ring's
; ground in one frame on a step or a rock, and the camera eases after it instead of hopping. 0 = rigid.
vertical_smoothing = 0.06
; Frame pacing (docs/HOST.md "Frame pacing"). MGSV runs 51-57 frames/s hidden in gamescope, one fixed game step per frame;
; shown as they came, 12-14% of Elden Ring's 60 frames repeated the last MGSV frame and the next jumped two (the camera
; "a bit jumpy"). smooth: every Elden Ring frame shows one point on MGSV's step timeline, a little behind its newest frame,
; blended from the two MGSV frames around it -- the camera, the puppet's motion and yaw (and with [Render] smooth_draws,
; Snake's and D-Walker's poses). smooth_delay: how far behind, in MGSV steps (auto: just enough that the next frame is
; almost always there, ~1.1 steps = ~20 ms live); smooth_extrapolate: steps carried on past the newest frame when the next
; one is late (an MGSV hitch).
smooth = true
smooth_delay = auto
smooth_extrapolate = 1.5
; Snake's root moves in whole animation keys, 2 or 3 per MGSV frame while he runs (7.8 / 11.7 cm, live; MGSV's own view
; steps the same), so the world stepped +-1.8 cm around his speed even when blended evenly. smooth_motion: the puppet's
; motion from a straight-line fit over this many MGSV frames instead (recorded runs: 1.2-1.4 -> 0.5-0.7 cm rms, at most a
; few cm off MGSV's path in starts, stops and turns); 0 = the plain blend.
smooth_motion = 7
; Also write MGSV's camera into Elden Ring's own player camera (WorldChrMan.chr_cam) every frame. Without it that
; camera spins on its own while Snake plays (VERIFIED live): Elden Ring's decisions that follow its camera (which far
; enemies animate every frame, 3D sound) are wrong.
sync_chr_cam = true
; And into the camera Elden Ring's HUD compass (and the markers on it) is computed from: GameRend's first camera,
; which Elden Ring refreshes from its own (spinning) follow camera before the compass reads it. Without it the
; compass swirls while Snake plays (player report; docs/HOST.md "Compass").
sync_compass_cam = true

[Actors]
; Characters within this radius (m), at most this many, go to MGSV.
radius = 60
max = 64

[Draw]
; Developer views through Elden Ring's CSEzDraw, off for players: MGSV's skeleton (green) and Snake's
; facing, the buddy marker (cyan), shot traces (red). Live: `pr er "draw skeleton on"` (draw lists them).
skeleton = false
buddy = false
tracers = false
tracer_seconds = 0.5

[Combat]
; Phase 3 combat; docs/COMBAT.md explains every key and the live test. Damage units are MGSV's
; (er/CombatLogic.cpp ValueOf: handgun 13, rifle 17, sniper 55, buckshot 6 per pellet...).
; Shot trace length (m).
trace_range = 150
; Snake's shots, CQC and explosions hurt Elden Ring characters (off: shots are only traced and logged).
damage = true
; How a hit is applied:
;   bullet = an Elden Ring bullet owned by the Tarnished spawned just in front of the target (ER's own hit:
;            flinch/stagger, poise, aggro, its defence), damage set per hit in the bullet's AtkParam_Pc row
;   hp     = ChangeHp / Kill directly (always lands; no reaction, no aggro)
;   auto   = bullet; until a bullet hit is seen to land, misses get the hp fallback, and verify_failures
;            misses in a row switch to hp for the session
route = auto
; Who can be hurt: hostile (Elden Ring's own team relation between the Tarnished and the target) | all.
targets = hostile
; Bullet route: the BulletParam row spawned (Throwing Dagger's; its AtkParam_Pc row is patched per hit
; while Snake plays and restored when the puppet stops), hide its flight effect, spawn distance before
; the hit point (m), and atkPhys = wanted damage x bullet_damage_mult (ER's defence reduces it again).
bullet_id = 10170000
bullet_hide_sfx = true
bullet_offset = 0.6
bullet_damage_mult = 1.9
; Elden Ring computes a player bullet's damage from the Tarnished's own weapon, not from the attack we write (live:
; ~42 per bullet on a Gatefront soldier whatever we asked for). top_up = true adds the rest of the wanted damage with
; ChangeHp once ER has applied its hit, scaled by how much of a normal hit got through (a raised shield still blocks);
; kills this way still give runes (VERIFIED live). false: ER's own damage only.
top_up = true
; How the wanted damage reaches the enemy (docs/COMBAT.md section 2, "Damage that syncs"):
;   topup    (default) Elden Ring's own bullet hit + the top-up above. The top-up is a direct HP write that a networked
;            session (Seamless Co-op) never sees: the session host owns its enemies' HP.
;   speffect (live 2026-10-14, single player: the same damage as topup, hit for hit; co-op, bosses, shields untested). The whole hit is Elden Ring's: the bullet carries the damage as fixed-damage SpEffect rows
;            in its spEffectId slots (a ladder, one row per decimal digit: 1..9999 HP exactly in at most 4 slots), the
;            same way it carries the sleep build-up. Elden Ring's own bullet damage is kept to speffect_bullet_share of the
;            wanted damage (flinch, poise, aggro and the guard reaction still come from it). If the rows do not land on
;            verify_failures hits in a row before one does, the top-up takes over for the session (logged).
; The ladder's carriers: 9 x damage_speffect_digits SpEffectParam rows from damage_speffect_base, blank in this
; regulation (checked by tests/test_host_combat), written with fixed values while Snake plays and restored after. Every
; player in a session must run the same values. A target seen guarding gets only the share its shield let through for
; speffect_guard_ms (unless Elden Ring turns out to drop a guarded bullet's SpEffects itself; the log says which).
damage_route = topup
damage_speffect_base = 20010640
damage_speffect_digits = 4
speffect_bullet_share = 0.1
speffect_first_correction = 10
speffect_guard_ms = 1500
; Elden Ring applies the rows a few frames after its own hit (live 2026-10-14: the rows' damage 70 ms after it): a ladder
; hit is judged once its damage showed, or speffect_wait_ms (ms) after Elden Ring's own part did. speffect_template: 0
; keeps the blank carrier rows (+ their damage and target bits); a SpEffectParam id copies that row into each carrier
; first (99441: Elden Ring's own "10 HP once"; both delivered live).
speffect_wait_ms = 300
speffect_template = 0
; A bullet hit counts as landed if the target lost HP (or died) within verify_ms (the top-up comes then too).
verify_ms = 300
verify_failures = 3
; Damage is counted in MGSV soldiers' lives (docs/COMBAT.md section 2): a hit is worth MGSV's own damage of that round
; as a share of a standard soldier's life (protocol v8 kGEvFire pad[1], x share_mult), or its class value / units_per_life
; when MGSV doesn't send one (handgun 13 -> 0.33 lives, rifle 17 -> 0.43, sniper 55 -> 1.4), x a reference HP for the
; target: its max HP for an ordinary enemy (a soldier dies to as many hits as in MGSV, wherever he stands), less for
; big ones: up to big_from x the Tarnished's max HP an enemy is ordinary, from boss_from x it is worth boss_lives
; soldiers (log-interpolated between). 45: an assault-rifle magazine with MGSV's own share (0.2115 a round) takes ~15%
; off a boss (live, Margit 4174 HP vs a 572 HP Tarnished: 30 rounds took 9.8% at the old 70).
units_per_life = 40
big_from = 1.5
boss_from = 5
boss_lives = 45
share_mult = 1
; A hit above this fraction of the target's height is a headshot: damage x headshot_mult on an ordinary enemy (MGSV's
; headshots kill a soldier), x headshot_mult_boss on a boss (interpolated between), and a stronger flinch.
head_fraction = 0.82
headshot_mult = 4.5
headshot_mult_boss = 1.5
; ...and on an ordinary enemy a lethal headshot takes at least this many soldiers' lives (MGSV: a headshot kills), fading to
; none at a boss: the assault rifle's own share (0.21) x 4.5 left a Limgrave soldier at 11 HP.
headshot_min_lives = 1.05
; D-Walker's rounds (kGEvBuddyFire) x this.
buddy_mult = 1
; Cap on one hit's damage.
max_damage = 9999
; Sleep (Elden Ring's sleep status) from a tranquilizer round (body / head), a CQC choke and each report of MGSV's
; sleep gas (every 0.5 s while the cloud lasts): a share of the target's own sleep resistance (Elden Ring's, with its
; area scaling: a Gatefront soldier has 226, VERIFIED live), so 2 darts in the body or 1 in the head and ~3 s in the
; gas put it to sleep anywhere; an immune one (999) gets none. Shares 0 = the absolute build-ups instead (also used
; when the resistance can't be read).
tranq_share = 0.6
tranq_share_head = 1.1
choke_share = 1.1
gas_share = 0.2
tranq_sleep = 80
tranq_sleep_head = 200
choke_sleep = 200
gas_sleep = 40
; The attack correction (%) of a sleep-only hit (a dart, the gas): Elden Ring weighs its own (weapon-based) hit by it.
; 0 = no damage, and the build-up still lands (VERIFIED live: 1 cost a Gatefront soldier 1 HP per gas report).
sleep_correction = 0
; Stun rounds (rubber, stun grenades): poise damage x this.
stun_poise_mult = 1
; Sleep build-up rides on the hit's attack (AtkParam spEffectId0..4 of the bullet route, as Elden Ring's own sleep
; weapons do it): SpEffect row base + n - 1 = n x step build-up (ER's own 25000..25019 = 10..200), several rows for more.
sleep_speffect_base = 25000
sleep_speffect_step = 10
sleep_speffect_count = 20
; CQC (kGEvMelee): damage per punch/kick/throw (MGSV units), poise of a throw / a strike.
melee_punch = 5
melee_kick = 7
melee_throw = 4
melee_throw_poise = 80
melee_strike_poise = 25
; CQC reach (m) and half angle (deg) in front of Snake, on top of the strike sphere MGSV reports.
melee_range = 1.6
melee_arc_deg = 60
; Blast radius (m) for explosive rounds and explosions that don't report one.
explosion_radius = 4
; At most this many applied hits per second (a token bucket; the rest are dropped and counted).
max_hits_per_second = 30
; Character capsule when its physics module's hit radius/height look wrong (m).
capsule_radius = 0.5
capsule_height = 1.8
; Fall damage to Snake: auto = computed here from the puppet's landing speed with kinematic motion
; (Elden Ring's own fall damage needs its proxy, i.e. motion = root_motion), host = always here, off.
fall_damage = auto
; Landing speeds (m/s): hurt from (~8 m drop), lethal from (~20 m drop).
fall_hurt_speed = 12.5
fall_lethal_speed = 19.8
; The guest's [Combat] life_scale (MGSV life per ER damage point): fall damage is sent in ER units.
guest_life_scale = 4
; Elden Ring's hits on the puppet: hurt_share = true costs Snake the share of his life they would have cost the
; Tarnished (a 44 HP hit on a 522 HP Tarnished = 8.4% of Snake's life), false sends the raw damage (x guest_life_scale
; on MGSV's side: 2% there, regenerated by MGSV in well under a second). x hurt_mult either way.
hurt_share = true
hurt_mult = 1
; Explosions Elden Ring can see (er/Explosion.h, docs/COMBAT.md section 9): MGSV's blasts are drawn with Elden Ring's own pot
; effects at the Elden Ring point. Damage is unchanged (it never comes from these).
;   bullet = each look's BulletParam burst row is copied, without its attack and SpEffects, into a cut-content carrier
;            row and spawned there (CSBulletManager::SpawnBullet); the carriers go back once the puppet is off
;   sfx    = a direct effect spawn: no verified call in this build, behaves as off (logged)
;   auto   = bullet if SpawnBullet, CSBulletManager and the params verify, else off (logged); off = none
; UNVERIFIED live: effect + sound of each look, the smoke look, the sizes.
explosion_fx = auto
; The looks, "<BulletParam row> [effect id instead of the row's own]": Fire Pot fireball, Holy Water Pot flash, Sleep Pot
; mist (renewed while MGSV's gas lasts), Fetid Pot cloud (its hit effect 300192 on the cloud row), D-Walker's flamethrower
; (the Dragonfire incantation's flames, one per spawn), and the breaker and shrapnel (the flying Fire Pot, with no effect and
; no sound, carrying the object-only attacks: see break_objects).
; Others: Explosive Stone 10183001, Lightning Pot 10032001, Poison Pot cloud 10037001, Volcano Pot 10060001;
; flames: Dragon-faced Flamethrower 8110000, Slug Flamethrower 4040170.
explosion_lethal = 10030001
explosion_stun = 10035001
explosion_sleep = 10064001
explosion_smoke = 10033001 300192
explosion_flame = 10700000
explosion_breaker = 10030000
explosion_shrapnel = 10030000
explosion_muzzle = 10030001
; explosion_muzzle: the muzzle flash (muzzle_flash below), the Fire Pot's fireball cut after its first flash.
; Carrier rows (lethal, stun, sleep, smoke, flame, breaker, shrapnel, muzzle), all different: nothing in the game spawns them (the cut
; Roped Freezing Pot's and Miranda's Prayer's bullets; tests/test_host_combat checks no goods/behaviour/bullet row refers to them).
explosion_carriers = 10048000, 10048001, 10302000, 10302001, 10302002, 10302003, 10302004, 10302005
; A blast bigger than one burst gets a ring around the centre: at most this many bursts per blast.
explosion_max_bursts = 7
; At most this many bursts per second (all kinds; the rest are dropped and counted).
explosion_per_second = 40
; MGSV reports a lingering cloud (sleep gas, smoke) every 0.5 s: one burst of it per this many seconds at most, and not
; before the cloud's last bursts are gone (their life: explosion_cloud_life s, 0 = the template's own).
explosion_cloud_repeat = 2.5
explosion_cloud_life = 6
; MGSV-mapped blasts, clouds and ring bursts are dropped onto Elden Ring's ground (a short ray down).
explosion_ground = true
; Our effect bullets alive at once, counted in Elden Ring's own bullet list (which the whole world shares: 128 + 128).
; Session 4: a minute of smoke at 7 bursts every 2.5 s ran it dry, and every hit bullet after it was refused.
explosion_max_live = 48
; Destructible assets (pots, crates, barrels, bushes, carts). Elden Ring breaks one when its flying Fire
; Pot flies into it: that bullet's own attack is object-only (no damage, atk_obj 10). The breaker is a copy of it with no
; effect and no sound (breaker_radius m, breaker_speed m/s from breaker_lead m before the point) carrying breaker_atk -- a row
; of the cut Roped Freezing Pot patched to no damage of any kind and no flinch, atk_obj breaker_obj_attack (10: pots, crates,
; bushes) -- through the point where Snake's round hit the world, his CQC strike met no one or (kinematic motion) his body
; bumped into something. Lethal blasts send shrapnel_count heavy breakers (explosion_atk, atk_obj explosion_obj_attack 100,
; meant for the defence-90/95 ones too) out to their radius (explosion_breaks). Live: carts and crates (defence 0) break by
; shot, strike and rocket; a defence-90 Limgrave fence (AEG700_013) stayed up even at atk_obj 999.
; breaker_hits_characters keeps the attack's oppose-target bit, as on the flying pot's own (a 0-damage touch). At most
; breaker_per_second breakers.
break_objects = true
breaker_atk = 10048000
breaker_obj_attack = 10
explosion_atk = 10048001
explosion_obj_attack = 100
breaker_radius = 0.15
breaker_speed = 25
breaker_lead = 0.6
shrapnel_count = 8
breaker_hits_characters = true
explosion_breaks = true
breaker_per_second = 20
; Explosive rounds fly from Snake's muzzle to where they meet the world or an enemy, drawn as a small body with a bright
; trail (er/Rounds.h): m/s for MGSV's missile / rocket launchers -- they leave at round_speed_rocket and their motor takes them
; to round_speed_rocket_boost after round_rocket_boost_after s (MGSV's own blast came 0.9-1.1 s after the shot 16-22 m away,
; 3.3-3.5 s 150 m away) -- and grenade rounds. round_flight = false: they go off at the impact point at once (the old way).
round_flight = true
round_speed_rocket = 16
round_speed_rocket_boost = 60
round_rocket_boost_after = 1
round_speed_grenade = 80
; D-Walker's flamethrower drawn with Elden Ring's flames along its stream (explosion_flame), at most flame_per_second.
flame_fx = true
flame_per_second = 6
; m/s the flames fly (MGSV's stream reaches 12 m; 0 = the look's own speed).
flame_speed = 14
; (roadmap 5.4) A muzzle flash at each shot: explosion_muzzle's effect (the Fire Pot's fireball, without its attack, sparks
; and sound) cut after muzzle_life s, muzzle_ahead m in front of MGSV's muzzle, at most muzzle_per_second (automatic fire);
; tranquilizer rounds only with muzzle_tranq (MGSV's are suppressed). Carrier: the 8th explosion_carriers row. UNVERIFIED live.
muzzle_flash = false
muzzle_per_second = 10
muzzle_life = 0.06
muzzle_ahead = 0.1
muzzle_tranq = false

[Progression]
; Elden Ring's progression makes Snake stronger (docs/COMBAT.md "Progression"). Off by default: Snake's damage is MGSV's own,
; counted in soldiers' lives (five assault-rifle body hits kill any ordinary enemy, a magazine takes ~15% of any boss).
; Vigor needs no option: Elden Ring's hits cost Snake the share of the Tarnished's max HP they take ([Combat] hurt_share), so
; every Vigor point (or HP talisman) makes Snake as much tougher as the Tarnished.
;   off    = MGSV's own damage
;   level  = x (rune level / level_reference) ^ level_exponent: with 20 and 0.5, level 10 x0.71, 40 x1.41, 80 x2, 150 x2.74
;   weapon = x (1 + weapon_bonus x upgrade / its maximum) of the right-hand armament in use: +0 x1, +12 x1.72, +25 (or a
;            somber +10) x2.5 with weapon_bonus 1.5 (the maximum comes from Elden Ring's ReinforceParamWeapon: 25 or 10)
;   both   = level x weapon
; Every lethal hit Snake (and his buddy) lands is multiplied (shots, CQC, blasts, D-Walker's rounds and flames), kept within
; min_factor .. max_factor; sleep and stun build-up are not. `pr er progression` shows the numbers and the factor.
damage_scaling = off
level_reference = 20
level_exponent = 0.5
weapon_bonus = 1.5
min_factor = 0.5
max_factor = 3

[TimeSkip]
; MGSV's Phantom Cigar moves Elden Ring's clock (protocol v13 kGEvTimeSkip, er/TimeSkip.h; UNVERIFIED live): when Snake smokes
; it (MGSV's item wheel, then hold the button), the game time MGSV's time-lapse runs through passes in Elden Ring too, written
; into Elden Ring's clock (WorldAreaTime) a step at a time while he smokes, so its sky follows. Smoke until night: Elden Ring's
; night. Each skip is spread over about smooth_ms (0 = at once), one clock write at most every step_ms.
; `pr er "timeskip 120"` does a 2-hour skip by hand. MGSV only sends skips with its [Cigar] TimeSkip on (off by default).
enabled = true
smooth_ms = 1000
step_ms = 100

[Stealth]
; Snake in MGSV's cardboard box (protocol v8 kGuestInBox; er/Stealth.h): while he keeps still in it (below still_speed
; m/s), or creeps (below slow_speed) for slow_grace s after keeping still, the Tarnished carries SpEffect speffect --
; 20004999: Elden Ring's enemies' sight and hearing of him x 0, no visual, no end -- so enemies that haven't noticed
; him pass by and those after him lose him; a hostile within reveal_distance m sees through the box. Taken off when he
; moves, leaves the box, dies or the puppet stops.
box_hide = true
speffect = 20004999
still_speed = 0.4
slow_speed = 1.8
slow_grace = 1.5
reveal_distance = 2
; A box with a poster on it (kGuestBoxPoster): enemies within poster_range m that can see it (a clear line from their
; eyes, the box in front of them) stop and stare for poster_stare s (ChrIns+0x538 no attack / no move), then go on;
; the same one stares again only after poster_cooldown s.
poster = true
poster_range = 15
poster_stare = 4
poster_cooldown = 12

[Cqc]
; CQC holds and throws on Elden Ring enemies (ROADMAP 2.2 tier 1, protocol v13 kGEvCqc, er/Cqc.h, docs/COMBAT.md 7a). MGSV grabs
; only its own soldiers; the guest sends what the player does (RT held = grab, RT with the stick pushed = throw, RT held on =
; choke, LB while holding = interrogate, RT up = release) and the nearest hostile within range m of Snake's chest, inside arc_deg
; in front of him, takes it: a grab = a flinch (grab_poise) and he is held in place (no attack / no move) until the release, a
; throw, hold_seconds, or Snake leave_distance m away; a throw = knockdown (throw_poise, throw_dmg_level), a choke = the sleep
; build-up of [Combat] choke_sleep / choke_share, interrogate = a corner line (choke and interrogate only on the one held). Only
; a token of damage (MGSV's strike that comes with the press is the damage). A boss (bigness at least boss_bigness: [Combat]
; big_from .. boss_from, or max HP at least boss_hp) only staggers (stagger_poise). Live pass B 2026-10-15 (Gatefront soldiers):
; hold, choke to sleep, throw (knockdown), interrogate and the 8 s hold cooldown all worked: on by default since (false: the
; events are only logged). Console: cqc [status|grab|throw|...|set <key> <value>].
enabled = true
range = 1.6
arc_deg = 70
boss_bigness = 0.5
hold_seconds = 6
leave_distance = 3
grab_poise = 15
throw_poise = 120
; Elden Ring's AtkParam dmgLevel of the throw (1 small .. 3 large flinch; 4 = a knockdown: live, a Gatefront soldier went down).
throw_dmg_level = 4
stagger_poise = 40
interrogate = true
; Max HP from which an enemy is a boss whatever the Tarnished's level (Margit 4174, a Tree Sentinel ~3000; 0 = bigness only).
boss_hp = 2000
; Seconds after a hold ends before the same enemy can be held again (a re-grab is then only a flinch): no endless freeze.
hold_cooldown = 8
; AtkParam correction (%) of the grab's flinch, the throw's knockdown and a boss's stagger: they then cost a token 1 HP (never
; lethal). A correction-0 bullet (a sleep dart's) gives no flinch live; 0 = damage-free anyway.
hit_correction = 10
; A CQC hit waits settle_ms (MGSV's punch of the same press takes Combat's bullet row first), then until no bullet of ours is in
; flight, at most retry_ms more (a busy row would drop its poise).
settle_ms = 150
retry_ms = 450

[Throw]
; Snake's thrown explosives (protocol v5/v6, er/Throw.h): MGSV flies its grenade over its flat airport, so the host flies
; its own copy from MGSV's release point and velocity through Elden Ring's collision (bouncing, rolling) and puts the
; blast where that copy is. Impact grenades (sleep, stun, smoke) go off where it first touches Elden Ring's world; fused
; ones (hand grenades) when MGSV's fuse says. false = MGSV's own blast point through the anchor, as before.
sim = true
; MGSV's gravity (m/s^2), the bounce (share of the speed into a surface kept / along it) and rolling.
gravity = 9.8
restitution = 0.3
friction = 0.65
roll_decel = 3
; An impact grenade whose MGSV twin went off first waits this long (s) for our copy to land.
impact_wait = 1.5
; Blast radius (m) of an impact grenade landing before MGSV reported that kind's own (then MGSV's is used).
radius_lethal = 7
radius_sleep = 9
radius_stun = 6
radius_smoke = 8
; The grenade as drawn in flight and on the ground (m).
ball_radius = 0.06
; MGSV's aiming arc while Snake aims a throwable (GuestState kGuestThrowAim, v6): a line of bright dots arc_spacing
; apart (radius arc_dot) through Elden Ring's collision and a ring (radius arc_ring) where it lands. auto | off.
arc = auto
arc_spacing = 0.3
arc_dot = 0.025
arc_ring = 0.55
; Linear RGB + alpha of the arc (MGSV's pale blue-white).
arc_color = 0.62, 0.9, 1.0, 0.95

[Mines]
; Snake's placed explosives (claymores, AP/sleep/stun mines, C4; protocol v5, er/Mines.h): kept where they were placed
; (on Elden Ring's ground), drawn with a blinking light, and set off (kHEvDetonate, once) when a hostile Elden Ring
; character comes within the trigger radius MGSV reports; C4 (radius 0) only ever goes off from MGSV.
enabled = true
; Seconds after placing before an enemy can set one off.
arm_seconds = 1.5
; Drawn body and light radius (m).
body_radius = 0.07
light_radius = 0.035

[Decoys]
; Snake's decoys (MGSV's inflatable / active / shock decoy; protocol v13 kGEvPlaced with AmmoKind decoy, er/Decoys.h;
; UNVERIFIED live): kept where they were set (on Elden Ring's ground), drawn as a soldier-shaped balloon. A hostile
; within range m that can see one (in front of it within cone degrees, a clear line from its eyes) stops and stares
; for stare s (ChrIns+0x538 no attack / no move, as at the box poster), then goes on; the same one stares again only
; after cooldown s. An active decoy is heard: within active_range m, no sight line needed. An enemy busy with Snake
; (within snake_close m of him, and nearer him than the decoy) ignores it. An enemy that comes within pop_distance m
; knocks it over: it collapses and is gone (kHEvDetonate -> the guest's kGEvPlacedGone); a shock decoy then is a stun
; blast of shock_radius m.
enabled = true
range = 15
active_range = 25
cone = 70
stare = 6
cooldown = 15
pop_distance = 1
snake_close = 4
shock_radius = 2.5
; The drawn soldier's height (m).
height = 1.75
; Also turn a staring enemy to face the decoy (ChrIns::SetYaw on an enemy, UNVERIFIED: verified on the player only).
