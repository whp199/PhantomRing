[Render]
; Phase 2: MGSV's own meshes (Snake, his gear, D-Walker), posed by this frame's matrices, drawn into Elden
; Ring's frame at Present (er/Renderer.h, docs/HOST.md "Rendering").
enabled = true
; Which owners of the guest's draw list are drawn: Snake (incl. his gear), the buddy, anything else.
draw_player = true
draw_buddy = true
draw_other = true
; (roadmap 5.4) Snake's grenades and rockets in flight drawn with MGSV's own meshes instead of a small ball: the guest tags
; the projectile's draws just after the release ([Capture] ProjectileMeshes in the guest ini: turn both on), the host learns
; them per item once two lists show them flying away along the release, and draws them at the copy it flies through Elden
; Ring, turned along its flight; until a mesh is learned, the ball. Off: tagged draws near Snake stay his. UNVERIFIED live.
projectile_meshes = false
; rad/s a thrown one tumbles about its flight while it flies.
projectile_spin = 9
; Use the camera/draw snapshot this many Elden Ring frames older than the newest at Present (0 = newest).
latency_frames = 0
; Face culling: none | back | front. none: some of MGSV's meshes (Snake's head, the launcher's tube) are wound
; the other way round and MGSV draws them two-sided; with back culling the head showed its inside.
; front_ccw = MGSV's front faces are counter-clockwise (D3D default: no). A mirrored anchor ([Axes] mirror_x = -1)
; flips the winding automatically.
cull = none
front_ccw = false
; Mirror the projection horizontally (only if pers_cam_1 row 0 turns out to be screen-left).
flip_x = false
; Stage A lighting: one directional light (towards the light, Elden Ring world) plus a sky/ground ambient.
light_dir = 0.35, 0.8, 0.45
light_color = 1, 0.96, 0.9
light_intensity = 2.2
ambient_up = 0.42, 0.45, 0.5
ambient_down = 0.2, 0.18, 0.15
exposure = 1
; Follow Elden Ring's clock: the light follows a sun arc by day (light_dir then only gives the
; azimuth's tilt) and becomes a dim blue moonlight at night (stage A approximation of ER's lighting).
day_night = true
; UNORM albedo textures hold sRGB-encoded colours (decoded in the shader; *_SRGB formats never are).
albedo_srgb = true
; Normal map channels: auto (BC3/DXT5nm -> alpha/green, else red/green) | rg | ag.
normal_xy = auto
; Brightness of 1.0 on an HDR10/scRGB swap chain (nits).
hdr_paper_white = 200
; 0 lit, 1 albedo, 2 normals, 3 uv, 4 facing (green front / red back), 5 bone index, 6 SRM channels.
debug_view = 0
; > 0: draw see-through with this opacity (0..1), e.g. 0.4 to check the mesh against the debug skeleton.
xray = 0
; Hide Snake behind Elden Ring's world: its scene depth (found by watching its DSV clears/binds) is read at
; Present. bias: relative depth tolerance; near: the near plane that depth was made with (0 = pers_cam_1's).
er_depth = true
er_depth_bias = 0.004
er_depth_near = 0
; Watch Elden Ring's render targets so `pr er "render probe"` can dump one frame's passes to the log
; (stage B research; the per-draw counters are only installed by the first probe).
probe = true
; Where Snake is drawn (docs/HOST.md "Rendering Snake"):
;   gbuffer = into Elden Ring's own G-buffer right after its G-buffer pass, so ITS lighting lights him: sun,
;             shadows received, light sets, ambient/GI, local lights, SSAO, fog, tone mapping, bloom
;             (stage C). Falls back to post for any frame whose structure doesn't match (logged).
;   post    = into Elden Ring's tone-mapped scene before its HUD, lit by the stage A light below (stage B).
;   present = over the finished frame (stage A).
stage = gbuffer
; Stage C. Elden Ring's reversed-Z depth mapping: finite (pers_cam_1 near/far) | infinite.
gbuffer_depth = finite
; Stage C. When in Elden Ring's G-buffer batch Snake is drawn: clear = right after Elden Ring clears its scene depth, before
; its own G-buffer draws (since 2026-10-14: drawn after its last G-buffer list, the background showed through Snake and
; D-Walker -- the player's "always see-through"); last = after its last G-buffer list (the old point); k = after the k-th.
gbuffer_point = clear
; Values Elden Ring's characters carry that MGSV's assets don't (measured on the Tarnished with
; `pr er "render gbuf peek"`): the stencil class bits its lighting passes select pixels by, the index into
; the area's light-set table (G-buffer RT2 alpha), the vertex AO (RT1 alpha) and translucency (RT1 blue).
; gbuffer_light_set = 0: Elden Ring's world light set (terrain, foliage, rock all carry 0), lit on every frame that shows
; any of its world. Its character sets (3, 4 ...) are lit only while an Elden Ring character using them is on screen: with
; the Tarnished hidden and no enemy in view Snake and D-Walker went pitch black (VERIFIED live, Gatefront: sets 3-6
; black, 0-2 lit; the same frame lit with the Tarnished shown). auto = learned from the Tarnished's own texels whenever
; he is visible (no puppet: while MGSV boots, after it goes; looks like him, with his rim light, but black whenever no
; Elden Ring character is in view); or a fixed index.
gbuffer_stencil = 0x50
gbuffer_light_set = 0
gbuffer_ao = 1
gbuffer_translucency = 0
; MGSV material -> Elden Ring: albedo x albedo_scale; gloss = (1 - SRM roughness)^2 x gloss_scale + gloss_bias;
; metalness = SRM blue x metal_scale (Fox SRM = specular, roughness, metalness).
albedo_scale = 1
gloss_scale = 1
gloss_bias = 0
metal_scale = 1
; auto: draws whose diffuse carries alpha (BC2/BC3/BC7: MGSV's hair cards, lashes, decals) are alpha-tested at
; alpha_ref | flag: only draws the guest flags.
alpha_test = auto
alpha_ref = 0.5
; Guest material ids (hex, comma-separated) whose albedo is painted with the camo pattern (texture 3) where the
; mask (texture 4) is set: D-Walker's armour panels.
camo_materials = 5216a6bb
; Guest material ids (hex, comma-separated) carrying MGSV's box poster (the anime girl, [Loadout] BoxPoster on the guest): its
; picture is texture 4 on the mesh's second UV set and replaces the cardboard wherever it isn't its plain background (the
; DSRT box, live 2026-10-12: the poster on its lid).
poster_materials = c94150c9
; off | log | on. A texture key that has been a diffuse, normal map or SRM is no other of those, and a diffuse that is a
; normal map by its content is none either: such a key is a stale one from the guest (D-Dog's coat and D-Walker next to the
; camera in false colours; docs/HOST.md "Material roles"). on leaves those slots empty (plain grey; an alpha card whose
; diffuse is refused becomes an opaque grey quad), log only logs each such texture once (`render` counts them), off is
; the old drawing. log until a live A/B has shown on to be safe.
role_guard = log
; off | log | on. on: poster_materials paint the poster only where texture 4 is one by its content (>= 15% of its blocks the
; plain near-white background), since a box without a poster may carry a layer mask there (painted black: a hypothesis).
; log: the poster is drawn as before and each box's texture 4 share is logged once (the threshold is unmeasured on the real
; poster, which is VERIFIED live as it is drawn now).
poster_check = log
; Snake's motion vectors into Elden Ring's velocity target (after its own velocity pass), so its TAA
; doesn't smear him: velocity = (NDC now - NDC last frame) x velocity_scale + velocity_bias.
velocity = true
; Snake's and D-Walker's poses blended between MGSV's two draw lists around the moment shown (frame pacing, needs [Camera]
; smooth): every bone matrix's translation lerped, rotation slerped; MGSV publishes a frame's draws about one frame after its
; state, so poses trail the camera by that much (as before), evenly.
smooth_draws = true
; Project with Elden Ring's own per-view constants (its TAA jitter, depth mapping and previous frame), copied on the
; GPU from the descriptor its vertex shaders read; used once a readback matches its camera, else our own matrices.
view_constants = true
; Snake and his buddy cast the sun's shadow: drawn into Elden Ring's shadow atlas with each cascade's light view
; (needs view_constants).
shadows = true
velocity_scale = 0.5, -0.5
velocity_bias = 0, 0
; MGSV-style near-camera dither fade (every stage): gone at the first distance from the camera (m), solid from
; the second. near_fade: Snake, per pixel. near_fade_other: D-Walker and the rest, per pixel and as a whole
; by its nearest part (so a D-Walker right in front of the camera fades out instead of filling the screen).
near_fade = 0.25, 0.6
near_fade_other = 0.5, 1.5
; Like MGSV, anything but Snake that stands between the camera and him (a part within occluder_radius m of the
; camera-to-Snake line, in front of him) is drawn at occluder_fade (0 gone .. 1 solid); never while he rides it.
occluder_fade = 0.15
occluder_radius = 1
; Upload budget per frame for newly received meshes/textures (MB).
upload_mb_per_frame = 64
; Snake from the moment Elden Ring's player dies (his death or Elden Ring's own) until the respawn:
; keep = drawn as MGSV shows him: the guest throws him to the ground and keeps him down until the respawn
; ([Combat] DeathCollapse, on by default), so he collapses where the Tarnished died; fade = dissolves away over
; death_fade_ms (for a guest without the collapse); cut = gone at once. The Tarnished stays hidden until the
; respawn either way.
death_visual = keep
death_fade_ms = 900
; Night vision: while Snake's goggles are on in MGSV (GuestState kGuestNvg), Elden Ring's tone-mapped picture -- the
; world, Snake and D-Walker, the throw arc; not its HUD -- becomes MGSV's bright green night vision: the scene's linear
; luminance to the power nvg_curve (< 1 lifts the dark more than the light, like a tube's automatic gain: with a linear 7 x
; the Castleward Tunnel stayed nearly black) x nvg_gain with a soft highlight roll-off (1 - exp(-gain x L^curve)), lifted by
; nvg_floor, coloured nvg_tint
; (linear RGB of full brightness), with per-pixel grain changing every frame (nvg_grain), a vignette (nvg_vignette) and
; optional scanlines (nvg_scanlines; 0 = off). Fades in and out over nvg_fade_ms. Off in cutscenes, loads and death.
nvg = true
nvg_gain = 5
nvg_curve = 0.6
nvg_floor = 0.025
nvg_tint = 0.30, 1.0, 0.40
nvg_grain = 0.07
nvg_vignette = 0.35
nvg_scanlines = 0
nvg_fade_ms = 250
; Validation runs on native Windows D3D12 only (UNVERIFIED live; docs/WINDOWS.md "For testers"): Microsoft's D3D12
; debug layer and DRED (device-removed breadcrumbs). Validation messages and a removed device's last GPU work go to
; PhantomRingHost.log ("d3d12 ..." lines). Needs Windows' optional feature "Graphics Tools" for the debug layer
; itself. Read when Elden Ring starts (it must be on before Elden Ring creates its D3D12 device). Slow: leave it off
; for play. gpu_validation (with debug_layer): GPU-based validation too, much slower again (expect a slide show).
debug_layer = false
gpu_validation = true

[Overlay]
; Phase 5: what PhantomRing draws over Elden Ring's finished frame (needs [Render] enabled: same hooks).
enabled = true
; MGSV's own HUD layer (crosshair, weapon and ammo, prompts) as the guest publishes it, scaled to the screen.
; Shown only while Snake plays and no Elden Ring menu is open; fades out (ms) when that ends.
hud = true
hud_fade_ms = 350
; A small MGSV-style crosshair at the screen centre while Snake aims: auto = only while no MGSV HUD layer
; arrives, on = always while aiming, off. reticle_scale sizes it.
reticle = auto
reticle_scale = 1
; MGSV's boot progress ("MGSV: loading Africa free roam (30020)"), its failures, and "MGSV is not running"
; (for absent_seconds) in a corner of the screen while Snake is not playing.
status = true
; Short messages for events: "Snake is in control", "MGSV stopped -- Elden Ring has the controller".
messages = true
message_seconds = 4
absent_seconds = 12
; Text size (1 = about 1.6% of the screen height) and the corner: top_right | top_left | bottom_right | bottom_left.
text_scale = 1
corner = top_right
; MGSV's HUD layer next to Elden Ring's own HUD (both scale with the screen: 4K and 1080p look the same). hud_scale
; and hud_offset (fractions of the screen width, height) move the whole layer. Two regions of the layer (x0, y0, x1, y1
; as fractions of MGSV's 16:9 HUD) move on their own; the rest (reticle, prompts, markers on the world) stays put:
;   hud_weapon_*: MGSV's weapon/item box, bottom right, sits right above Elden Ring's rune counter: moved up 5%
;                 so the runes a kill gives ("+64") show between the two; the box (from x 0.78) and the bar row under it
;                 (from x 0.62, y 0.84) move together; MGSV's call-menu help line (y 0.78, out to x 0.69) stays whole;
;   hud_notify_*: MGSV's notifications ("Development Complete ..." at y 0.58-0.61) end above Elden Ring's skill label
;                 (0.63) and equipment slots: left in place; -0.03 lifts them if they crowd it.
; A region of 0, 0, 0, 0 is off.
hud_scale = 1
hud_offset = 0, 0
hud_weapon_region = 0.78, 0.70, 1, 1
hud_weapon_bar_region = 0.62, 0.84, 1, 1
hud_weapon_offset = 0, -0.05
hud_notify_region = 0, 0.30, 0.40, 0.72
hud_notify_offset = 0, 0

[Fulton]
; MGSV's Fulton on an Elden Ring enemy (protocol v12 kGEvFulton, docs/HOST.md): the enemy is lifted under the balloon and taken
; out of the world with no death and no drop. runes = true gives the Tarnished the runes it would have dropped (its NpcParam
; getSoul, as a plain kill in a first playthrough; no Golden Scarab or New Game+ scaling).
runes = true

[Marking]
; MGSV's binocular marking on Elden Ring's characters (protocol v13 kGuestBinoculars, docs/HOST.md "Marking"): while Snake
; looks through his binoculars (RB held), a character near the centre of the view, within range and in plain sight, is marked
; after dwell seconds -- a triangle over his head (red: hostile, white: anyone else) with his distance from Snake, seen through
; walls, until the next load screen (fast travel, a death, the title); it fades when he dies. Reads and ray casts only
; (nothing in Elden Ring is changed).
; Console: `mark [status | binoculars on|off|auto | nearest | clear]`. UNVERIFIED live.
enabled = true
; all (every character but the Tarnished) | hostile (only those the ActorTable calls hostile)
targets = all
; m from the camera
range = 150
; the view centre: a share of the camera's half vertical FOV (the binoculars' zoom narrows it too), never under min_cone_deg
cone = 0.12
min_cone_deg = 1
; seconds of looking that mark (MGSV: about half a second)
dwell = 0.5
; Elden Ring's ray cast from the camera to his chest: nothing is marked through a wall (a ray stopping on his own body counts)
line_of_sight = true
; skip characters Elden Ring doesn't render (dummy shooters of ballistas and arrow traps, ones an event hides: ChrIns+0x1C5
; bit3) or that have no HP; a marked one hides while he isn't rendered. UNVERIFIED live: false if real soldiers go unmarked
rendered_only = true
; seconds a dead one's mark fades
fade = 1
max_marked = 64
; characters looked through each frame, nearest first
max_characters = 64
; his distance in metres, over the triangle: always | centre (only marks within 10 degrees of the view centre) | off
distance = always
; the triangle's half height as a share of the screen height; a digit's half height as a share of the triangle's
size = 0.012
text_size = 0.75
; m over a character's feet where the triangle's tip is
height = 2.2
