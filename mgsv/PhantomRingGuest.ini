; PhantomRing MGSV guest (dinput8.dll in the MGS_TPP folder) -- defaults shown.
; The DLL is a plain dinput8 proxy unless the launcher sets PHANTOMRING=1 AND the exe is mgsvtpp.exe
; 1.0.15.4 (TimeDateStamp 0x6A4CB898, SizeOfImage 0xA01D000, then sha256 on a worker thread).
; Log: PhantomRingGuest.log next to the DLL. Dev console: tools/phantomring (Lua, or '!status' etc.).

[Guest]
; Detailed logging (every warp, shot, hurt, console line).
Debug = false

[Link]
; Shared mapping. Empty = platform default: file:Z:\dev\shm\phantomring_v1 under Wine/Proton,
; name:Local\PhantomRing_v1 on Windows.
Mapping =

[Boot]
; Steer MGSV from its title screen into the sandbox on its own. false = become ready in whatever
; mission the player loads by hand.
Auto = true
; Sandbox mission: 30050 Mother Base free roam (MTBS_FREE), 30010 Afghanistan, 30020 Africa.
; Default: Africa (buddies can't come to Mother Base), on the Nova Braga Airport tarmac.
Mission = 30020
; Where to park Snake (MGSV world, x, y, z) and his facing (degrees). Empty = wherever the mission
; starts him. Pick a big flat spot: he walks around inside [Motion] Radius of it.
; Read a candidate in game with the console:  return vars.playerPosX, vars.playerPosY, vars.playerPosZ
; Default: Nova Braga Airport apron (VERIFIED live: open, flat paved tarmac in every direction).
; Change it live with the console:  !sandbox <mission> [x y z [rotY]]
Position = 820.6, -11.1, 1179.1
RotY = 90
; Disable soldiers/staff (TppSoldier2, TppHostage2) in the sandbox.
DisableSoldiers = true
; MGSV's markers (marked soldiers, items) off at setup and every this many seconds while Snake plays: a marked MGSV soldier near
; the sandbox shows in Elden Ring as MGSV's floating "32m" marker and pulls Snake's aim onto itself (live: a rocket launcher's
; aim stuck 30 deg off the target, its rockets flew there). 0 = never.
ClearMarkersSec = 5
; MGSV's "Auto-Aim Correction" option (OPTIONS > Control Settings) while PhantomRing runs. Off: with it on, readying a weapon
; turned Snake's aim onto the disabled MGSV soldiers standing around the sandbox (live: a rocket launcher aimed up to 25 deg
; to their side swung onto one). Changed in memory only, and only while MGSV's saves are blocked ([Saves] Block = true).
AutoAim = false
; MGSV's own damage off (TppGameStatus S_DISABLE_PLAYER_DAMAGE): only Elden Ring hurts Snake.
Invincible = true
; Clock (hh:mm:ss, empty = keep) and freeze it there.
Clock = 12:00:00
FreezeClock = true
; TppDefine.WEATHER key (SUNNY, CLOUDY, RAINY, SANDSTORM, FOGGY, POURING); empty = keep.
Weather = SUNNY
; Pulse A at the title ("press any button", Continue -- it opens focused) and on loading tips.
PressButtons = true
TimeoutSec = 900

[Buddy]
; Battle buddy deployed in the sandbox: walker (D-Walker), horse, dog, quiet, none.
; It must be developed (and alive) in your MGSV save; otherwise the guest says so and goes on without it.
Type = walker
; A buddy destroyed in MGSV's world is revived and called again (TppBuddyService.UnsetDeadBuddyType + MGSV's own call), at
; boot and when it is lost while Snake plays (10 s later): Elden Ring has no repair for it, and MGSV's save is never written.
Revive = true
; Called this far in front of Snake and this far to his right (m; Side < 0 = left). Never behind him: the camera
; is there (MGSV fades things near its own camera, Elden Ring doesn't, and a walker there would fill the screen).
Ahead = 3
Side = 3.5
; D-Walker doesn't follow Snake by itself in MGSV (it waits until whistled). Follow = true issues MGSV's own call-menu
; command "Whistle (call D-Walker)" whenever it is more than FollowDistance (m) from where it should be and Snake isn't
; riding it, at most every FollowEveryMs: it walks over (and MGSV places it nearer first when it is far).
Follow = true
FollowDistance = 2.5
FollowEveryMs = 1000
; Where the whistle sends it, relative to Snake as the camera looks at him (m): FollowAhead further from the camera
; (negative: toward it), FollowSide to the right on screen (negative: left). MGSV's own whistle brings it to Snake
; himself, where it blocks his shots (MGSV holds fire with a walker in front of the muzzle) and stands between him and
; the camera; beside him on the left of the screen (the camera looks over his right shoulder) it does neither, and
; 1 m ahead / 2.5 m left it stays inside MGSV's narrow (36 deg) view. 0, 0 = MGSV's behaviour. Live: !follow spot a s.
FollowAhead = 1
FollowSide = -2.5
; The spot leads Snake along his velocity by this many seconds (at most 8 m ahead), so a running Snake has D-Walker
; beside him instead of catching up from behind. 0 = beside where he is now.
FollowLeadSec = 0.8
; While D-Walker walks to its spot, the spot moves with Snake (MGSV's walker AI re-reads it) instead of a new whistle:
; it changes course without stopping. A walker that stops gaining is whistled again.
FollowSteer = true
; Your own buddy commands (Stealth Mode = wait, Search Mode, Intercept Mode, from MGSV's call menu or iDroid) pause the
; auto-follow above, so the walker keeps the mode you chose; your next "Whistle (call D-Walker)" or Normal Mode resumes it.
FollowRespectCommands = true
; Side offset of the spot while Snake runs (m; negative = left on screen): MGSV's walker stops walking once it is within
; ~3 m of a moving player, so beside a running Snake it keeps further out.
FollowSideRunning = -4.5
; MGSV's walker answers a whistle ~3 s late: a walker more than this far (m) behind a running Snake is moved this close,
; only from a place the camera can't see to another it can't see (behind the camera). 0 = never.
FollowCatchUp = 6
; How auto-follow sends D-Walker. record (default) = no message at all: the walker's destination is written the way
; MGSV's whistle writes it, so its mode never changes and it never announces anything; a far walker (70 m) is still placed
; nearer (~22 m) and walks over, and it keeps up with a running Snake as well as with the whistle. command = MGSV's own
; "Whistle (call D-Walker)" (it also puts the walker back into Normal Mode, and a mode change makes it announce the
; mode). restore = that whistle with the walker's mode kept. All three VERIFIED live (docs/GUEST.md 18.3); record
; whistles (mode kept) until the walker is known (its first message, at deployment).
FollowMethod = record
; The D-Walker modes auto-follow works in (normal, stealth, search, intercept, mode1, mode2, or all). In any other mode
; you chose from the call menu (Stealth Mode = wait, Search Mode, Intercept Mode) the walker is left to MGSV until you
; whistle or choose Normal Mode.
FollowModes = normal
; D-Horse (Type = horse) stays where it is in MGSV until whistled: MGSV's own "Whistle (call D-Horse)" is issued whenever it
; is more than HorseFollowDistance (m) from Snake on foot, at most every HorseWhistleEveryMs; it gallops over and stops
; beside him. 0 = never (your own whistle: hold LB, right stick right, click the right stick).
HorseFollowDistance = 15
HorseWhistleEveryMs = 6000
; D-Horse treadmill (on since live pass B 2026-10-15: a 300 m straight gallop east from Gatefront and 1.2 km of riding in all,
; 307 moves, every one followed by the horse, no failure; after the ride it stood 3.7 m beside Snake, no jump, no whistle).
; D-Horse answers no SetPosition, so without this the treadmill leaves it alone --
; no treadmill while Snake rides it (MGSV's airport limits the ride: a terminal ~40 m north) and on foot it is whistled back
; after every jump (in Elden Ring it jumps by the radius, then gallops over). true = it is moved through its own location object
; (found near its skin, as ActorProxy finds soldiers'): by the same jump on foot, and *as* the jump while ridden. Anything that
; fails 3 times puts it back to the old way for the session; a ridden jump Snake doesn't follow within 300 ms puts the horse back
; under him and stops ridden jumps for the session. HorseMoveRider = true also places Snake by the same jump while he rides (only
; if the saddle turns out not to carry him). Console: !horse, !horse on|off|scan, !horse shift <dx> <dz>.
HorseTreadmill = true
HorseMoveRider = false

[Motion]
; How Snake is kept on the sandbox while his motion drives Elden Ring:
;   native_treadmill  past Radius, back to the centre through the character's own set-position call (default). MGSV's
;                     camera stays where it was (VERIFIED live 2026-10-12: running toward the camera, camRel and the camera's
;                     yaw unchanged across the jump; D-Walker keeps its place).
;   treadmill         the same with Lua Warp: MGSV turns its camera behind Snake on every Warp, so running toward or
;                     across the camera it swung round every ~1.3 s (live: 180 deg running toward it)
;   native            that call every frame: he runs in place at the centre (M1 option 1, UNVERIFIED)
;   off               never (debugging)
; The native modes fall back to the treadmill whenever their checks fail, and on vehicles/D-Walker.
Hold = native_treadmill
Radius = 6
; A one-frame jump bigger than this (m) is a teleport, not motion (never added to the odometer).
TeleportJump = 3
WarpCooldownMs = 1000
; Treadmill also while riding (moves the vehicle/D-Walker with SetPosition).
TreadmillOnVehicle = true
; Riding: the vehicle's SetPosition left MGSV's camera where it was, looking at the vehicle's new place (it swung 75-170
; deg on every warp); its orientation is asked back right after (Player.RequestToSetCameraRotation).
RidingCameraKeep = true
; Move the deployed buddy by the same jump, so it keeps its place relative to Snake.
TreadmillMovesBuddy = true
; Velocity smoothing (EMA factor per frame, 0..1).
VelocitySmoothing = 0.2
; Metres added to the height Snake is warped to: MGSV's Warp (and the native placement) put him ~0.6-0.8 m
; below the given root height, and he climbs out of the ground into a crouch. 0.8 lands him on his feet.
WarpLift = 0.8
; Snake's dive (X) published to the host as kGuestDiving (protocol v13; the host's [Puppet] hop lifts its puppet over a gap
; or onto a ledge). MGSV has no dive status: X while Snake stands, then within DiveConfirmMs (ms) a sign that a dive plays
; (he leaves STAND, goes CRAWL, leaves NORMAL_ACTION, or speeds up from a walk; the log says which, UNVERIFIED live).
DiveFlag = true
DiveConfirmMs = 600

[Jump]
; Snake jumps (MGSV has none). A press of Button while he stands, walks or runs on foot (not crouched, prone, aiming,
; riding, in a box, a menu, CQC or another action) lifts him Lift m in MGSV's own world (the treadmill's native placement:
; MGSV plays its own fall and landing; WarpLift is added as for every placement) and sets GuestState kGuestJumping until he
; has landed there (MaxAirMs at the latest); Elden Ring's side jumps the puppet through its own world ([Puppet] jump*).
; MGSV never sees the button, unless one of PassWith is held when it goes down: R3 is MGSV's own with LB (the call menu's
; select), RB (binoculars), LT (aiming: shoulder change; past 30 of 255, XInput's threshold) or the D-pad (its weapon and
; item wheels: R3 = Use there -- the Phantom Cigar is smoked that way; live 2026-10-15) -- nor while MGSV itself has
; Snake aiming, riding, in a menu or the binoculars (the game thread tells the pad thread). Button: ls rs a b x y lb rb up down left right back, or XInput
; bits (0x0080). R3 because MGSV's L3 is its DASH (sprint). Lift 0.2-1.5 m: never enough for MGSV's fall damage.
; Live 2026-10-14/15 (passes A and B): works at Stormveil's cliffside and with the middle mouse button.
Enabled = true
Button = rs
PassWith = lb rb lt up down left right
Lift = 1.0
MaxAirMs = 2000

[Pacing]
; MGSV paces itself to 60 frames/s, but its job system's ~25 threads poll for work with Sleep(1) -- 1.06 ms under Wine --
; and the hand-offs add up: hidden next to Elden Ring it ran 51-58 frames/s (19.4 ms a frame while the camera turns), and
; because it advances its game one fixed step per frame, Snake and his camera ran 85-95% of real speed. MGSV's own Sleep(1)
; becomes a delay of JobSleepUs microseconds instead (live: idle 57.7 -> 60.0 frames/s, panning 50.5 -> 53.7, +0.2 of a CPU
; core). Shorter isn't better: 250 brought 77-168 ms hitches (one every ~25 s), 100 more. 0 = MGSV's 1 ms.
JobSleepUs = 500
; Diagnostics: detours under ntdll's delay/wait calls so `!pace start [all]` can say where MGSV's threads wait (by call
; chain, into PhantomRingGuest.pace.txt). Off: `!pace` still has the frame and Present timings.
WaitProbe = false

[Online]
; Keep MGSV offline: its connections to Konami's servers fail as if there were no network, and it
; plays offline. PhantomRing needs none of MGSV's online features (FOB, events, MB coins), and since
; the July 2026 patch MGSV's first login asks for a permanent country/region choice and agreement to
; Konami's updated Terms of Use, which you can do yourself in a normal MGSV session if you want.
Offline = true

[Input]
; Let the player's pad reach MGSV before the sandbox is ready (normally only boot pulses do).
PadDuringBoot = false
; DirectInput8 enumerates no game controllers, so MGSV only sees the virtual XInput pad.
HideDirectInputControllers = true
; Forward MGSV's rumble (XInputSetState) to Elden Ring's pad as kGEvRumble.
Rumble = true
; Never let MGSV minimise itself, warp the cursor or grab the foreground.
GuardWindow = true

[Window]
; Windows players (docs/WINDOWS.md): MGSV shares the desktop with Elden Ring, so the guest keeps MGSV's window
; hidden (never minimised), off the taskbar and never active. auto = on when not under Wine/Proton (there
; `pr launch` runs MGSV in headless gamescope instead); true / false force it.
Hidden = auto
; While hidden: MGSV's focus queries (GetForegroundWindow, GetActiveWindow, GetFocus) answer its own window and
; its window never sees WM_ACTIVATEAPP false / WM_KILLFOCUS, so it plays as if it had the focus.
SpoofFocus = true
; While hidden: MGSV's "is the window visible" check before drawing a view (0x14024A1D0) answers yes, so it keeps
; drawing (the capture sends what it draws to Elden Ring).
ForceRender = true
; While hidden: keep the swap chain windowed even if MGSV is set to exclusive fullscreen (its
; SetFullscreenState/ResizeTarget calls are held windowed).
ForceWindowed = true
; While hidden: MGSV quits by itself after this many seconds without Elden Ring (it has no window to close).
; With [Saves] Block it is simply ended; with saves live it is asked to close first (ended 30 s later
; if it doesn't). 0 = never.
QuitWithoutHostSec = 120

[Camera]
; FOV from the player camera's focal length (mm): vfov = 2*atan(FilmHeightMm/2/focal). UNVERIFIED film
; size: compare with what MGSV shows and adjust, or force a FOV with FovOverrideDeg (> 0).
FilmHeightMm = 24
FovOverrideDeg = 0
Near = 0.1

[Combat]
; MGSV life points per Elden Ring damage point (DESIGN 13b.5).
LifeScale = 4
; Apply Elden Ring hits by writing vars.playerLife (UNVERIFIED that the game keeps it; the log says).
NativeLifeWrite = true
; MGSV's own feedback for an Elden Ring hit, through its Lua: the camera shakes (it is Elden Ring's camera
; too; Player.RequestToSetCameraNoise) and Snake gets blood where the hit came from (Player.SetBloodToModel).
; Both UNVERIFIED live (the log shows hurt=... results).
HurtFeedback = true
HurtBlood = true
; MGSV regenerates after its own hits only after a pause, slowly at first: life holds ~2.4 s, then the rate grows to
; ~750 life/s over ~6.25 s (measured live after an MGSV fall). It never sees Elden Ring's hits, so it used to regenerate
; from them at once at the full rate (Snake survived 18 of Margit's hits in 70 s). RegenGate = true gives Elden Ring's
; hits that same pause and curve (every hit starts it again); false = MGSV's full rate right after each hit.
RegenGate = true
RegenDelaySec = 2.4
RegenRampSec = 6.25
RegenRate = 750
; When Snake dies in Elden Ring (his life runs out, or Elden Ring kills the Tarnished: a fall...), he throws himself
; to the ground (his own dive when standing, else the prone stance) and lies there, the pad cut off, until Elden
; Ring respawns him; then he stands up. MGSV's own death / game over is never triggered.
DeathCollapse = true
; Shots from MGSV's ShotSolver (exact origin/direction per round). If that hook is refused, from ammo counters.
NativeShots = true
FireFromAmmo = true
; Bone used as the muzzle for ammo-counter shots (12 = right wrist of the 178-bone skeleton).
MuzzleBone = 12
; CQC strikes as kGEvMelee (attack-serial poll), with the attack shape's own sphere when it validates.
Melee = true
MeleeShapeGeometry = true
; Only for ammo-counter shots (the native path knows the bullet): equip ids (comma list, 0x.. ok)
; that fire tranquilizer / stun rounds.
TranqWeapons =
StunWeapons =
; Snake's thrown and placed explosives (grenades, sleep/stun/smoke grenades, molotovs, C4, claymores, mines) as
; explosions in Elden Ring (kGEvExplosion with lethal / sleep / stun / smoke). Explosive rounds fired from guns
; (grenade pistol, rockets, under-barrel launchers) always go as shots and blast where they hit in Elden Ring.
Blasts = true
; Each thrown explosive's release point and velocity (kGEvThrow; Elden Ring flies its own copy through its world and
; blasts where that lands), and the arc while Snake aims one (GuestState: the host draws the preview).
Throws = true
; Placed explosives (claymores, mines, C4): where they are (kGEvPlaced / kGEvPlacedGone); an Elden Ring enemy walking
; into one makes the host send kHEvDetonate and the guest sets it off in MGSV (C4 is the player's: C4Detonator below).
Placed = true
; (With Placed) Snake's decoys (inflatable, active, shock) as kGEvPlaced with AmmoKind decoy: Elden Ring's enemies who see one
; stop and stare at it (host [Decoys]); one an enemy walks into pops there (kHEvDetonate -> kGEvPlacedGone, not announced
; again). DecoyPopInMgsv = true also sets MGSV's own "set off" bit on it (UNVERIFIED what MGSV's decoy does with it).
Decoys = true
DecoyPopInMgsv = false
; Let Snake's thrown explosives, the mines Elden Ring's enemies set off and his gun-fired rounds (rockets, grenade rounds)
; blast in MGSV's sandbox too. Their blasts are Elden Ring's (where its copy lies, where the round hits Elden Ring's world);
; in MGSV's sandbox they could only hit D-Walker next to Snake (live: a rocket fired with the walker in the line of fire
; destroyed it). false = MGSV's own blast of them is skipped (they are still reported to Elden Ring).
MgsvBlasts = false
; C4's detonator (docs/GUEST.md 18.8a; live 2026-10-14 with C4Backup): with C4 in hand, MGSV's own detonator button -- ACTION, Y by
; default -- sets off Snake's oldest placed C4, and its blast goes to Elden Ring where the C4 lies there. MGSV's own
; detonator is watched; if it refuses the press (the log says why) the guest sets the C4 off itself.
; C4DetonateAll = true: every live C4 per press instead of the oldest. false = C4 only ever goes off through MGSV.
C4Detonator = true
; A tap (released within 0.4 s) with C4 in hand that MGSV doesn't answer within C4GraceMs is set off by the guest -- MGSV's
; own detonator never takes the press in the sandbox (live 2026-10-14: 0 of 5 taps answered; with this on each tap set off
; the oldest C4 in Elden Ring, 2 of 2, and a Y tap at D-Walker with C4 in hand mounted it and set nothing off). On by
; default since then; false = such a tap is only logged (and C4 never goes off). Y is also MGSV's supply-box pickup: with C4
; in hand next to one, a tap may set a C4 off too (untested); a held Y (Fulton) never counts. C4Buttons = the PlayerPad bits
; of the detonator (0x20 ACTION; all of them held, the last one pressed).
C4Backup = true
C4Buttons = 0x20
C4GraceMs = 250
C4DetonateAll = false

[Saves]
; Never let MGSV write its saves while PhantomRing runs (Steam Cloud writes kept in memory; file
; writes to save paths redirected into SinkDir next to the DLL). The launcher backs saves up too.
Block = true
SinkDir = PhantomRingSaveSink

[Audio]
; MGSV's sound plays next to Elden Ring's. Snake's own sounds (gunshots, reloads, footsteps, CQC, his voice),
; D-Walker's and MGSV's UI blips always play; these categories are off by default (on / off):
; Music: MGSV's BGM. Ambience: wind, birds, insects; off uses MGSV's own pause-menu mute, which silences the
; music as well. Radio: radio calls (Kaz, Ocelot, mission radio) and the iDroid's voice announcements.
; (older values: keep = Music on, mute_bgm = Music off, mute_all = everything above off)
Music = off
Ambience = off
Radio = off
; D-Walker's own sounds (~15 dB louder than Snake's) as a gain on their Wwise game objects (AK
; SetGameObjectOutputBusVolume). EXPERIMENTAL: no audible effect yet (docs/GUEST.md 18.2). 1 = off (no Wwise hooks);
; another value installs them with the `!sound` diagnostics (posts, positions, per-event gains).
WalkerVolume = 1

[Menu]
; MGSV's pause menu (Back) keeps only Controls & Manual and Options: checkpoint, return to ACC and return to title
; would end the sandbox.
SafePauseMenu = true
; The iDroid (Start, held) can't start a mission, call the helicopter or change the location (the sandbox would be
; gone); supply drops, buddy commands, the map and the loadout stay.
BlockMissions = true
; ...but MISSIONS > BUDDY SUPPORT keeps DISMISS <buddy>: MGSV sends the buddy away and PhantomRing follows that choice (no
; buddy, nothing called back) until you deploy one there (D-Walker, D-Horse, D-Dog, Quiet: whatever your save has). false =
; DISMISS struck out (the buddy can only be swapped for another).
BuddyDismiss = true
; MGSV ignores Start while Snake aims (LT), uses the binoculars (RB) or is in the middle of an action (a dive, CQC...). When the
; iDroid hold reaches it then, the request is kept: the pad goes neutral for a moment (that ends the aim) and Start is pressed
; again until the iDroid opens or this many ms passed. 0 = off (MGSV sees Elden Ring's Start only).
IDroidRetryMs = 3000

[Loadout]
; Snake's weapons in the sandbox, by TppEquip name (tools/re/data/tppequip_ids_1.0.15.4.txt). Empty = what the save has.
; Primary (hip), Primary2 (back) and Secondary (handgun) go into MGSV's sortie loadout BEFORE the sandbox mission loads,
; so MGSV loads their models with the mission (a weapon given mid-mission can't be drawn); if the sandbox is already
; loaded, the guest reloads it once (docs/GUEST.md 18.7). The default handgun is the WU S.PISTOL (EQP_WP_West_thg_010):
; tranquilizer darts, sleep in Elden Ring; its grades are EQP_WP_West_thg_020 .. 050. The save's primaries are kept.
; Support is a comma list (up to 8), given with MGSV's Player.ChangeEquip: EQP_SWP_Grenade, EQP_SWP_SleepingGusGrenade, ...
Primary = EQP_WP_East_ar_010
Primary2 = EQP_WP_West_ms_010
Secondary = EQP_WP_West_thg_010
Support =
; The poster on Snake's first cardboard box (D-pad left: the item menu; X there changes it): moe_v / moe_h (the anime
; pin-up girls), gravure_v / gravure_h, sol_afgn / sol_mafr / sol_zrs; empty = leave the box as the save has it. A poster
; the save hasn't collected is added to Mother Base in memory only (saves are blocked). Box = the box put into a free item
; slot when the save has none.
BoxPoster = moe_v
Box = EQP_IT_CBox

[Capture]
; Phase 2: observe MGSV's Direct3D 11 device and publish what it draws for Snake and his buddy
; (meshes/textures once on the render ring, one draw list per frame) for Elden Ring to draw.
Enabled = true
; MGSV's own HUD (reticle, weapon box, prompts, notifications, iDroid) as a transparent layer for Elden
; Ring to composite on top (HUD triple buffer; premultiplied RGBA8). Needs Enabled.
Hud = true
; Publish the HUD layer every Nth frame (1 = every frame, 2 = every other frame).
HudEvery = 1
; (roadmap 5.4) The grenade Snake throws and the rocket he fires: for half a second after the release, a rigid draw where the
; projectile must be (on the throw's arc, ahead of the muzzle on the round's line) is published as a projectile
; (kOwnerProjectile) so Elden Ring can draw that mesh at the copy it flies ([Render] projectile_meshes on the host).
; UNVERIFIED live, so off: a draw tagged by mistake leaves Snake / the buddy in Elden Ring's frame. Turn it on together with
; the host's projectile_meshes. false = those draws stay as before (Snake's within 2.5 m, else not sent).
ProjectileMeshes = false
; Our copies of MGSV's textures and buffers are let go a minute after their last use, and MGSV may then create another one at
; the same address: true re-copies and re-keys such a texture/mesh (and keeps the ones in use), false is the old behaviour (a
; texture made later at a freed address went to Elden Ring as the old one: D-Dog's coat and D-Walker next to the camera in
; false colours, the box black; docs/GUEST.md 15.3).
Revalidate = true

[Fulton]
; MGSV's own Fulton on a sleeping Elden Ring enemy (docs/GUEST.md 20.4-20.5; needs the host to flag sleeping enemies, ActorTable
; kActorAsleep). Walk up to an enemy you put to sleep (the WU S.PISTOL's darts) and hold Y when MGSV offers its Fulton: when its
; balloon takes the soldier, Elden Ring lifts the enemy out of its world (kGEvFulton).
Enabled = true
; proxy (default): an MGSV soldier is moved to where the sleeping enemy lies and put to sleep there (ActorProxy v1 for sleeping
;   enemies only, also with [Proxies] Enabled = false; live with a stand-in host).
; anchor: a soldier near the sandbox is put to sleep where he stands and Snake is placed beside him in MGSV as he stands by the
;   enemy in Elden Ring (Elden Ring sees no jump); walking Leave (m) away or the enemy waking puts both back. MGSV's own
;   surroundings of that soldier (sandbags, walls) are Snake's meanwhile. The settings below are the anchor's.
Method = proxy
Reach = 3
Leave = 5
; Anchor soldiers: standing within this of the sandbox centre (m), at its height; each one fultoned is gone for the session.
CandidateRadius = 90
; The soldier this far above where he lay (m) = MGSV's balloon took him (a balloon that hits a roof lets him fall back from ~4 m).
Rise = 8

[Cigar]
; The Phantom Cigar moves Elden Ring's clock (docs/GUEST.md 18.16, protocol v13 kGEvTimeSkip). Smoke it as in
; MGSV (the item wheel, then use it): its time-lapse runs, and the game time that passes passes in Elden Ring too -- smoke until
; night for Elden Ring's night. Live 2026-10-15 (pass B): two smokes moved Elden Ring 12:14 -> 18:02 -> 02:14 (MGSV's own
; time-lapse takes over ~2.5 s into the smoke); on by default since. It changes Elden Ring's time of day, which Elden Ring
; saves (night-only enemies). Pick the cigar in MGSV's item wheel (D-pad left held, right stick) and click R3 there (Use).
; The sandbox's clock is frozen ([Boot] FreezeClock):
; if MGSV's own time-lapse hasn't moved it half a second into the smoke, it runs at ClockScale (MGSV's own speed is 20)
; meanwhile; it is frozen again when he stops, and held frozen while he doesn't smoke. A signal on for over 2 minutes is
; taken as stuck and ignored until it drops.
TimeSkip = true
ClockScale = 20

[Cqc]
; CQC holds and throws on Elden Ring enemies (ROADMAP 2.2 tier 1, docs/GUEST.md 21; protocol v13 kGEvCqc). MGSV grabs only its own
; soldiers, so the guest reads the player's CQC from MGSV's own pad bits (PlayerVars.scannedButtonsDirect) and sends it; the host
; decides whether an Elden Ring enemy is in reach (its [Cqc] section). Unaimed RT with the left stick pushed past ThrowStick = a
; throw; RT held HoldMs = a grab; while it stays held, InterrogateButtons = interrogate (once), ChokeButtons or RT held ChokeMs
; after the grab = choke (once); RT let go = release. UNVERIFIED live: which pad bits MGSV sets for each (every button change
; during a hold is logged). Console: !cqc, !cqc <grab|throw|choke|interrogate|release>.
Enabled = true
; MGSV's own hold (PlayerStatus CQC_HOLD/CQC_CONTINUOUS, the CQC state's action callback: a real grab on an ActorProxy soldier)
; starts the grab at once. Off until it is seen live that a plain strike sets neither.
MgsvHold = false
HoldMs = 350
ChokeMs = 2500
MaxHoldMs = 10000
CooldownMs = 400
ThrowStick = 0.6
; PlayerPad bits (docs/research/mgsv-runtime-re.md 5.5): FIRE 0x10 | CQC 0x8000; HOLD 0x8 (aiming: RT is a shot); CALL /
; INTERROGATE 0x200. 0 = none.
Buttons = 0x8010
AimButtons = 0x8
InterrogateButtons = 0x200
ChokeButtons = 0
; The grab's reach sent with each event (m; informational, the host uses its own).
Range = 1.4

[Proxies]
; ActorProxy v1 (docs/GUEST.md 20.5; live with a stand-in Elden Ring 2026-10-14, not yet with the real one: off by default). MGSV
; soldiers near the sandbox stand in for the nearest hostile Elden Ring characters (the host's ActorTable): each is enabled as an
; inert "puppet" and moved every frame through his own location object, so MGSV's aim assist, marking and buddies target Elden
; Ring's enemies, and an enemy asleep in Elden Ring is an asleep soldier MGSV offers its own Fulton on (kGEvFulton). Elden Ring
; keeps damage authority: Snake's rounds count only through ShotSolver; what the soldiers suffer in MGSV is never reported. Every
; soldier that isn't a proxy stays disabled (not drawn, not targeted). Console: !proxy, !proxy on|off (this session).
Enabled = false
; Soldiers used as proxies (the nearest hostiles within MaxDistance m of Snake).
Max = 4
MaxDistance = 60
; A proxy nearer than this to Snake (m) or to the buddy is taken out (disabled) while it is (MGSV's draws that close are captured
; as theirs) -- except an asleep one: MGSV's Fulton wants him right there (his draws are kept out by CaptureRadius).
SnakeClearance = 3.5
BuddyClearance = 5.5
; (v0: parked soldiers waited this far below the sandbox centre; v1 disables them instead -- unused.)
ParkDepth = 100
; How old a fresh ActorTable is when it arrives (ms): the treadmill warps inside that window are taken back out of it.
TableLagMs = 33
; MGSV's Auto-Aim Correction back on while proxies run and every pool soldier is placed (only with the save guards complete,
; as [Boot] AutoAim). Off: aim assist stays off.
AutoAim = true
; Leave MGSV's markers alone while proxies run ([Boot] ClearMarkersSec would erase the marks on them).
KeepMarkers = true
; Capture drops MGSV draws this near a proxy (m) and nearer to it than to Snake (never sent to Elden Ring as Snake's).
CaptureRadius = 1.5
; Inert full proxies (docs/GUEST.md 20.6; these apply only with Enabled = true -- the Fulton-only proxies are unchanged; UNVERIFIED
; live). With the real Elden Ring the full proxies put MGSV on alert within 80 s and their read-back flapped on Elden Ring's heights.
; Inert: each proxy gets MGSV's SetRestrictNotice and SetPuppet before and right after he is enabled (no moment of live AI at his
; post), refreshed every 2 s.
Inert = true
; Hand a proxy no route when he is enabled (SetEnabled's noAssignRoute). Off: enabled as the live v1 test did.
NoAssignRoute = false
; Hold MGSV's alert phase at 0: at an alert every soldier outside the slots is disabled again (every 3 s while it lasts) and MGSV's
; command posts are set back to sneak (once a second); still on alert after AlertGiveUpSec seconds -> full proxies off
; (`!proxy on` tries again).
PhaseLock = true
AlertGiveUpSec = 20
; ground: a proxy stands at his enemy's x/z on the sandbox ground (MGSV's flat ground can't hold a soldier 1-5 m above or below it);
; enemy: at the enemy's height (v1).
Height = ground
; A proxy within this of the height he was put at (m) stands where he should (MGSV's own ground under a far proxy differs a little).
HeightTolerance = 2
; A round aimed at a proxy on the ground goes to the same point of his enemy at the enemy's real height (Elden Ring's hit test).
; A round that already meets an enemy's real body is left as aimed.
AimHeightFix = true

[Lua]
; phantomring.lua next to the DLL replaces the embedded script (reloaded when it changes).
OverrideFile = phantomring.lua
; Write the embedded script as phantomring.default.lua at start (a starting point for the override).
DumpDefault = true
